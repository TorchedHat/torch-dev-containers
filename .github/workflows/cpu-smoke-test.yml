name: cpu-smoke-test

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main
    paths:
      - .github/workflows/cpu-smoke-test.yml
      - dockerfiles/Dockerfile
      - scripts/**
  pull_request:
    paths:
      - .github/workflows/cpu-smoke-test.yml
      - dockerfiles/Dockerfile
      - scripts/**
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build base image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: dockerfiles/Dockerfile
          push: false
          load: true
          tags: triton-dev-containers/base:centos9
          build-args: |
            CENTOS_VERSION=9
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run CPU smoke test
        run: |
          docker run --rm \
            -e TRITON_CPU_BACKEND=1 \
            triton-dev-containers/base:centos9 \
            bash -c '
              set -euo pipefail
              echo "=== CPU Smoke Test ==="
              echo "Checking Python..."
              python3 --version
              echo "Checking pip..."
              pip --version
              echo "Checking uv..."
              uv --version
              echo "Checking build tools..."
              cmake --version
              clang --version
              ninja --version
              echo "Checking workspace..."
              test -d /workspace/.venv
              echo "=== CPU Smoke Test PASSED ==="
            '
