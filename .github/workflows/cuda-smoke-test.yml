name: cuda-smoke-test

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main
    paths:
      - .github/workflows/cuda-smoke-test.yml
      - dockerfiles/Dockerfile
      - scripts/**
  pull_request:
    paths:
      - .github/workflows/cuda-smoke-test.yml
      - dockerfiles/Dockerfile
      - scripts/**
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build base image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: dockerfiles/Dockerfile
          push: false
          load: true
          tags: triton-dev-containers/base:centos9
          build-args: |
            CENTOS_VERSION=9
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run CUDA smoke test
        run: |
          docker run --rm \
            -e CUDA_VERSION=12-9 \
            triton-dev-containers/base:centos9 \
            bash -c '
              set -euo pipefail
              echo "=== CUDA Smoke Test ==="
              echo "Checking Python..."
              python3 --version
              echo "Checking CUDA installation..."
              test -d /usr/local/cuda
              nvcc --version
              echo "Checking CUDA libraries..."
              ls /usr/local/cuda/lib64/libcudart.so*
              echo "=== CUDA Smoke Test PASSED ==="
            '
