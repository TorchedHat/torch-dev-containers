name: runtime-smoke-test

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main
    paths:
      - .github/workflows/runtime-smoke-test.yml
      - dockerfiles/Dockerfile
      - scripts/**
  pull_request:
    paths:
      - .github/workflows/runtime-smoke-test.yml
      - dockerfiles/Dockerfile
      - scripts/**
  workflow_dispatch:

jobs:
  build-base-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build base image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: dockerfiles/Dockerfile
          push: false
          load: true
          tags: triton-dev-containers/base:centos9
          build-args: |
            CENTOS_VERSION=9
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save base image
        run: docker save triton-dev-containers/base:centos9 -o /tmp/base-image.tar

      - name: Upload base image artifact
        uses: actions/upload-artifact@v4
        with:
          name: base-image
          path: /tmp/base-image.tar
          retention-days: 1

  smoke-test-cpu:
    needs: build-base-image
    runs-on: ubuntu-latest
    steps:
      - name: Download base image
        uses: actions/download-artifact@v4
        with:
          name: base-image
          path: /tmp

      - name: Load base image
        run: docker load -i /tmp/base-image.tar

      - name: Run CPU smoke test
        run: |
          docker run --rm \
            -e TRITON_CPU_BACKEND=1 \
            triton-dev-containers/base:centos9 \
            bash -c '
              set -euo pipefail
              echo "=== CPU Smoke Test ==="
              echo "Checking Python..."
              python3 --version
              echo "Checking pip..."
              pip --version
              echo "Checking uv..."
              uv --version
              echo "Checking build tools..."
              cmake --version
              clang --version
              ninja --version
              echo "Checking workspace..."
              test -d /workspace/.venv
              echo "=== CPU Smoke Test PASSED ==="
            '

  smoke-test-cuda:
    needs: build-base-image
    runs-on: ubuntu-latest
    steps:
      - name: Download base image
        uses: actions/download-artifact@v4
        with:
          name: base-image
          path: /tmp

      - name: Load base image
        run: docker load -i /tmp/base-image.tar

      - name: Run CUDA smoke test
        run: |
          docker run --rm \
            -e CUDA_VERSION=12-9 \
            triton-dev-containers/base:centos9 \
            bash -c '
              set -euo pipefail
              echo "=== CUDA Smoke Test ==="
              echo "Checking Python..."
              python3 --version
              echo "Checking CUDA installation..."
              test -d /usr/local/cuda
              nvcc --version
              echo "Checking CUDA libraries..."
              ls /usr/local/cuda/lib64/libcudart.so*
              echo "=== CUDA Smoke Test PASSED ==="
            '

  smoke-test-rocm:
    needs: build-base-image
    runs-on: ubuntu-latest
    steps:
      - name: Download base image
        uses: actions/download-artifact@v4
        with:
          name: base-image
          path: /tmp

      - name: Load base image
        run: docker load -i /tmp/base-image.tar

      - name: Run ROCm smoke test
        run: |
          docker run --rm \
            -e ROCM_VERSION=7.1.1 \
            -e ROCM_RHEL_VERSION=9.7 \
            triton-dev-containers/base:centos9 \
            bash -c '
              set -euo pipefail
              echo "=== ROCm Smoke Test ==="
              echo "Checking Python..."
              python3 --version
              echo "Checking ROCm installation..."
              test -d /opt/rocm
              echo "Checking ROCm binaries..."
              ls /opt/rocm/bin/
              echo "=== ROCm Smoke Test PASSED ==="
            '
